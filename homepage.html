<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anasayfa - ASYA AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.3.2/markdown-it.min.js"></script>
    <style>
        /* CSS stillerin burada hiç değişmeden kalacak... */
        :root {
            --background: #050810; /* Daha derin bir siyah */
            --sidebar: rgba(17, 25, 40, 0.7);
            --card: rgba(17, 25, 40, 0.7);
            --card-strong: rgba(17, 25, 40, 0.85);
            --border: rgba(255, 255, 255, 0.125);
            --text-primary: #E0E0E0;
            --text-secondary: #a0aec0;
            --accent: #38E5C6;
            --glow-color: rgba(56, 229, 198, 0.15);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-primary);
            overflow: hidden;
        }
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4a5568; }

        /* --- YENİLENMİŞ GLASSMORPHISM --- */
        .glass {
            background: var(--card);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .glass-strong {
             background: var(--card-strong);
             backdrop-filter: blur(22px) saturate(200%);
             border: 1px solid var(--border);
        }
        .card-hover:hover {
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5), 0 0 20px 0 var(--glow-color);
            border-color: rgba(56, 229, 198, 0.25);
            transform: translateY(-3px);
        }
        .soft { border-radius: 20px; }
        .pill { border-radius: 999px; }

        /* --- YENİLENMİŞ NAVİGASYON --- */
        .nav-link {
            display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem;
            border-radius: 12px; color: var(--text-secondary);
            transition: all 0.2s ease;
            position: relative;
            border: 1px solid transparent;
        }
        .nav-link:hover { background: rgba(255, 255, 255, .05); color: white; }
        .nav-link.active {
            background: rgba(56, 229, 198, 0.1);
            color: white; font-weight: 600;
            border-color: rgba(56, 229, 198, 0.2);
        }
        .main-button {
            background-color: var(--accent); color: var(--background);
            transition: all 0.3s ease; border-radius: 12px;
        }
        .main-button:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(56, 229, 198, 0.5);
        }
        
        /* --- YENİ ANİMASYONLAR --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .feed-item {
            opacity: 0; /* Animasyon için başlangıç durumu */
            animation: slideInUp 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }
        
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s ease-out; }

        .chat-history-item:hover { background-color: rgba(255, 255, 255, 0.05); }

        /* --- YENİ BEĞENİ BUTONU ANİMASYONU --- */
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .like-btn.liked { color: var(--accent); }
        .like-btn.liked svg {
            fill: var(--accent);
            animation: heartBeat 0.4s ease-in-out;
        }
        
        .input { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; padding: .5rem .75rem; transition: all .2s ease; }
        .input:focus { outline: none; border-color: rgba(56, 229, 198, 0.35); box-shadow: 0 0 0 3px rgba(56,229,198,0.12); }

        /* Diğer stiller (Değişiklik yok) */
        .chat-history-item { font-size: 0.8rem; padding: 0.5rem 0.75rem; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .table-mini th, .table-mini td { padding:.5rem .6rem; font-size:.85rem; }
        .badge { font-size:.7rem; padding:.15rem .5rem; border-radius:999px; border:1px solid var(--border); background: rgba(255,255,255,.04); cursor:pointer; transition: all .2s ease; }
        .badge.active { background: var(--accent); color: var(--background); border-color: var(--accent); font-weight: 600; }
        .todo-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.03); border-radius: 10px; padding: 0.5rem 0.75rem; transition: all 0.2s ease; }
        .todo-item:hover { background: rgba(255,255,255,0.06); }
        .todo-label { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; flex: 1; font-size: 0.9rem; }
        .todo-checkbox { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .todo-label:hover .todo-checkbox { border-color: var(--accent); }
        .todo-item.done .todo-checkbox { background-color: var(--accent); border-color: var(--accent); }
        .todo-item.done .todo-checkbox svg { transform: scale(1); }
        .todo-checkbox svg { color: var(--background); width: 12px; height: 12px; transform: scale(0); transition: transform 0.2s ease; }
        .todo-item.done .todo-text { text-decoration: line-through; color: var(--text-secondary); }
        .schedule-table { border-collapse: separate; border-spacing: 0.5rem; }
        .schedule-table th, .schedule-table td { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 0.5rem; text-align: center; border: 1px solid transparent; position: relative; }
        .schedule-table th { font-weight: 600; font-size: 0.8rem; color: var(--text-secondary); }
        .schedule-entry { width: 100%; min-height: 60px; background: transparent; border: none; resize: none; text-align: center; font-size: 0.85rem; color: var(--text-primary); padding: 0.5rem; display: flex; align-items: center; justify-content: center; }
        .schedule-add-btn { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(255,255,255,0.1); color: var(--text-secondary); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; opacity: 0.5; }
        .schedule-table td:hover .schedule-add-btn { opacity: 1; background: var(--accent); color: var(--background); }
        .messenger-tab-btn.active { background-color: var(--accent); color: var(--background); box-shadow: 0 0 10px rgba(56, 229, 198, 0.3); }
        .messenger-tab-content { display: none; }
        .messenger-tab-content.active { display: block; animation: fadeIn 0.3s ease-out; }
        #messenger-widget.collapsed #messenger-body { height: 0 !important; padding-top: 0; padding-bottom: 0; opacity: 0; transform: translateY(-10px); }
        #messenger-widget.collapsed #messenger-toggle-icon { transform: rotate(180deg); }
        .chat-list-item { transition: background-color 0.2s ease; }
        .chat-list-item:hover { background-color: rgba(255,255,255,0.05); }
        .chat-bubble { padding: 0.6rem 1rem; border-radius: 1.25rem; max-width: 75%; width: fit-content; font-size: 0.9rem; line-height: 1.4; }
        .chat-bubble.sent { background-color: var(--accent); color: var(--background); border-bottom-right-radius: 0.5rem; align-self: flex-end; }
        .chat-bubble.received { background-color: var(--card-strong); border: 1px solid var(--border); border-bottom-left-radius: 0.5rem; align-self: flex-start; }
        @keyframes slideUpChat { from { opacity: 0; transform: translateY(25px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .chat-window { width: 340px; height: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; animation: slideUpChat 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); pointer-events: auto; }
        .chat-window-messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column-reverse; }
        .gpa-planner-tab { padding: 0.5rem 1.25rem; font-size: 0.9rem; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s ease-in-out; border: 2px solid transparent; color: var(--text-secondary); }
        .gpa-planner-tab.active { color: var(--text-primary); background-color: rgba(56, 229, 198, 0.1); border-color: rgba(56, 229, 198, 0.25); }
        .tab-content-panel, .library-tab-content { display: none; }
        .tab-content-panel.active, .library-tab-content.active { display: block; animation: fadeIn 0.4s ease-out forwards; }
        .library-item { background: rgba(255,255,255,0.03); border-radius: 10px; padding: 0.75rem 1rem; display: flex; align-items: center; gap: 1rem; transition: background .2s ease; }
        .library-item:hover { background: rgba(255,255,255,0.06); }
        .ai-chat-container { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 900px; margin: 0 auto; }
        .ai-chat-messages { flex-grow: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        .ai-message { display: flex; gap: 0.75rem; align-items: flex-start; }
        .ai-message .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ai-message .content { padding: 0.75rem 1.25rem; border-radius: 1.25rem; max-width: 85%; font-size: 0.95rem; line-height: 1.6; }
        .ai-message.user { justify-content: flex-end; }
        .ai-message.user .content { background-color: var(--accent); color: var(--background); border-bottom-right-radius: 0.5rem; }
        .ai-message.bot .avatar { background-color: var(--card-strong); border: 1px solid var(--border); }
        .ai-message.bot .content { background-color: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 0.5rem; }
        .ai-message.bot .content img { max-width: 100%; border-radius: 10px; margin-top: 10px; }
        .ai-message.bot .content strong { color: var(--accent); }
        .ai-message.bot .content code { background-color: rgba(0,0,0,0.3); padding: 0.1rem 0.4rem; border-radius: 5px; font-size: 0.85rem;}
        .ai-message.bot .content pre { background-color: rgba(0,0,0,0.3); padding: 0.75rem; border-radius: 8px; margin: 0.5rem 0; white-space: pre-wrap; font-size: 0.85rem;}
        .ai-chat-input-area { padding: 0.5rem 1rem 1rem 1rem; flex-shrink: 0; }
        .ai-chat-input-wrapper { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 0.5rem; display: flex; flex-direction: column; align-items: stretch; transition: box-shadow 0.2s ease; }
        .ai-chat-input-wrapper:focus-within { border-color: rgba(56, 229, 198, 0.35); box-shadow: 0 0 0 3px rgba(56,229,198,0.12); }
        .ai-chat-input-inner { display: flex; align-items: flex-end; gap: 0.5rem; }
        .ai-chat-textarea { width: 100%; background: transparent; border: none; outline: none; box-shadow: none; color: var(--text-primary); padding: 0.5rem; font-size: 1rem; line-height: 1.5; max-height: 200px; overflow-y: auto; word-break: break-word; min-height: 40px; cursor: text; }
        .ai-chat-textarea:empty::before { content: attr(data-placeholder); color: var(--text-secondary); pointer-events: none; }
        .ai-chat-tool-btn { background-color: rgba(255,255,255,0.05); color: var(--text-secondary); width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; border: none; cursor: pointer; }
        .ai-chat-tool-btn:hover { background-color: rgba(255,255,255,0.1); color: var(--text-primary); }
        .ai-chat-tool-btn.active { background-color: var(--accent); color: var(--background); box-shadow: 0 0 15px rgba(56, 229, 198, 0.3); }
        .ai-chat-send-btn { background-color: var(--accent); color: var(--background); }
        .ai-chat-send-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(56, 229, 198, 0.3); background-color: var(--accent); color: var(--background); }
        .ai-quick-prompts { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; }
        .ai-quick-prompt-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-secondary); padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.8rem; font-weight: 500; white-space: nowrap; cursor: pointer; transition: all 0.2s ease; }
        .ai-quick-prompt-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); border-color: var(--accent); }
        #image-preview-container { padding: 0.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid var(--border); }
        #image-preview-container.hidden { display: none; }
        .image-preview-item { position: relative; display: inline-block; }
        #image-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        #remove-image-btn { position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 1; text-align: center; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.2s ease; }
        #remove-image-btn:hover { transform: scale(1.1); }
    </style>
</head>
<body class="antialiased">
    <div id="scene-container"></div>
    <div class="p-3 h-screen w-screen">
        <div id="loading-overlay" class="fixed inset-0 bg-background z-50 flex items-center justify-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-accent"></div>
        </div>

        <div class="h-full hidden" id="main-content">
            <aside class="w-64 flex-shrink-0 glass soft p-3 flex-col border-r border-transparent fixed h-full transition-transform duration-300 ease-in-out -translate-x-full lg:translate-x-0 lg:flex" id="sidebar">
                <div class="flex items-center justify-center h-16">
                    <img src="assets/logo.png" alt="ASYA Logo" class="h-9 w-9"><span class="ml-3 text-xl font-bold text-white">ASYA</span>
                </div>
                
                <nav id="main-nav" class="flex-1 px-1 py-4 space-y-2 overflow-y-auto"></nav>
                
                <div id="chat-history-container" class="px-1 py-2 space-y-2 border-t border-border hidden">
                    <h4 class="text-xs font-semibold text-text-secondary px-3">SOHBET GEÇMİŞİ</h4>
                    <div id="chat-history-list" class="space-y-1">
                        <div class="chat-history-item text-text-secondary">Vaka Tartışması: Pnömoni</div>
                        <div class="chat-history-item text-text-secondary">Solunum Fizyolojisi Soru-Cevap</div>
                        <div class="chat-history-item text-text-secondary">Nadir Görülen Tümörler</div>
                    </div>
                </div>

                <div class="px-2 py-4 border-t border-border mt-auto">
                    <div class="flex items-center">
                        <img id="user-profile-img" class="h-10 w-10 rounded-full object-cover border-2 border-accent" src="https://placehold.co/40x40/0B1120/E0E0E0?text=A" alt="Profil Resmi">
                        <div class="ml-3">
                            <p id="user-display-name" class="text-sm font-semibold text-white">Yükleniyor...</p>
                            <p id="user-role-display" class="text-xs text-text-secondary capitalize">Kullanıcı Rolü</p>
                        </div>
                    </div>
                    <button id="logout-btn" class="w-full mt-4 flex items-center justify-center text-text-secondary hover:text-white transition-colors duration-200 py-2 rounded-lg bg-red-500/10 hover:bg-red-500/20">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        Çıkış Yap
                    </button>
                </div>
            </aside>

            <div class="lg:pl-72 w-full h-full flex flex-col">
                <header class="glass-strong soft px-4 py-3 flex items-center justify-between">
                    <button id="sidebar-toggle" class="lg:hidden p-2 rounded-md bg-white/5 text-white">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                    <div class="text-sm font-semibold hidden lg:block" id="header-title">Anasayfa</div>
                    <div class="flex items-center gap-4">
                        <span class="text-sm text-text-secondary" id="current-date"></span>
                        <div class="w-px h-6 bg-border"></div>
                        <span class="font-semibold text-accent text-sm" id="user-platform-title">ASYA Platform</span>
                    </div>
                </header>

                <main class="flex-1 p-0 pt-3 overflow-hidden">
                    <div class="w-full mx-auto px-1 h-full">
                        <div id="views-container" class="h-full"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    
    <div id="chat-windows-container" class="fixed bottom-0 p-3 flex items-end gap-4 z-20 pointer-events-none" style="right: 1.5rem;"></div>

    <script type="module">
        // Firebase ve kütüphaneleri içeri aktar
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- YENİ: MODÜLLERİ İÇERİ AKTAR ---
        import dashboardModule from './modules/dashboard.js';
        import studyAssistantModule from './modules/study_assistant.js';
        import libraryModule from './modules/library.js';
        import gpaPlannerModule from './modules/gpa_planner.js';
        import aiAssistantDoctorModule from './modules/ai_assistant_doctor.js';
        import llmChatModule from './modules/llm_chat.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBT4Dd62CBQDrOQYCdR4hDfKjnONFH2D-s",
            authDomain: "asyamed-b4c27.firebaseapp.com",
            projectId: "asyamed-b4c27",
            storageBucket: "asyamed-b4c27.firebasestorage.app",
            messagingSenderId: "720925032297",
            appId: "1:720925032297:web:ca31e2630f9f42a9f5c7f8"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- GLOBAL UI ELEMENTLERİ ---
        const loadingOverlay = document.getElementById('loading-overlay');
        const mainContent = document.getElementById('main-content');
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const mainNav = document.getElementById('main-nav');
        const viewsContainer = document.getElementById('views-container');
        const headerTitle = document.getElementById('header-title');
        const chatHistoryContainer = document.getElementById('chat-history-container');
        const chatWindowsContainer = document.getElementById('chat-windows-container');
        
        // --- MOBİL SIDEBAR ---
        sidebarToggle.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'));
        document.getElementById('current-date').textContent = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
        
        // --- APP STATE (Tüm uygulama verisi) ---
        const asyaState = {
            loaded: false,
            gradeScale: { "AA":4.0, "BA":3.5, "BB":3.0, "CB":2.5, "CC":2.0, "DC":1.5, "DD":1.0, "FD":0.5, "FF":0.0 },
            targetFutureGrade: "BA",
            commonCourses: [
                "Anatomi","Histoloji","Embriyoloji","Fizyoloji","Biyokimya","Mikrobiyoloji","Patoloji","Farmakoloji",
                "Biyoistatistik","Tıbbi Biyoloji","Halk Sağlığı","Pediatri","Dahiliye","Kardiyoloji","Göğüs Hastalıkları",
                "Nöroloji","Psikiyatri","Genel Cerrahi","Kadın Doğum","Ortopedi","Üroloji","KBB","Göz","Dermatoloji","Enfeksiyon"
            ],
            gpa: { years: [] },
            planner: {
                monthYear: { year: new Date().getFullYear(), month: new Date().getMonth() },
                selectedDate: new Date().toISOString().slice(0,10),
                byDate: {}, weekly: [], daily: [], schedule: {}
            },
            library: { years: [] }
        };
        const genId = () => Math.random().toString(36).slice(2) + Date.now().toString(36);

        // --- YARDIMCI FONKSİYONLAR (GPA, Takvim vb.) ---
        const computeGPA = () => {
            let totalCred=0, totalPts=0, totalCredAll=0, totalPtsAll=0;
            const target = asyaState.targetFutureGrade;
            const scale = asyaState.gradeScale;
            (asyaState.gpa.years||[]).forEach(y=>{
                (y.kuruls||[]).forEach(k=>{
                    (k.courses||[]).forEach(c=>{
                        const cred = Number(c.credit)||0;
                        totalCredAll += cred;
                        const hasGrade = c.grade && scale[c.grade] !== undefined;
                        if(hasGrade){
                            totalCred += cred;
                            totalPts  += cred * scale[c.grade];
                            totalPtsAll += cred * scale[c.grade];
                        } else {
                            if(target && scale[target] !== undefined) {
                                totalPtsAll += cred * scale[target];
                            }
                        }
                    });
                });
            });
            const cgpa = totalCred ? (totalPts/totalCred) : 0;
            const projected = totalCredAll ? (totalPtsAll/totalCredAll) : cgpa;
            return { cgpa: Number(cgpa.toFixed(3)), projected: Number(projected.toFixed(3)) };
        };
        const yearGPA = (year) => {
            const scale = asyaState.gradeScale;
            let tc=0,tp=0;
            (year.kuruls||[]).forEach(k=>{
                (k.courses||[]).forEach(c=>{
                    const cred=Number(c.credit)||0;
                    if(c.grade && scale[c.grade]!==undefined){
                        tc+=cred; tp+=cred*scale[c.grade];
                    }
                });
            });
            return tc? Number((tp/tc).toFixed(3)) : 0;

        function initBackgroundAnimation() {
            const container = document.getElementById('scene-container');
            if (!container || !window.THREE) return;
            let scene, camera, renderer, points, points2;
            function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
                camera.position.z = 400;
                renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                container.appendChild(renderer.domElement);
                
                const particles = window.innerWidth < 768 ? 500 : 800;
                const areaWidth = window.innerWidth * 1.5, areaHeight = window.innerHeight * 1.5;
                
                const vertices = [];
                for (let i = 0; i < particles; i++) {
                    vertices.push((Math.random() * areaWidth) - areaWidth / 2, (Math.random() * areaHeight) - areaHeight / 2, (Math.random() - 0.5) * 600);
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                points = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0x38E5C6, size: 1.5, transparent: true, opacity: 0.7 }));
                scene.add(points);

                const vertices2 = [];
                for (let i = 0; i < particles / 2; i++) {
                    vertices2.push((Math.random() * areaWidth) - areaWidth / 2, (Math.random() * areaHeight) - areaHeight / 2, (Math.random() - 0.5) * 600);
                }
                const geometry2 = new THREE.BufferGeometry();
                geometry2.setAttribute('position', new THREE.Float32BufferAttribute(vertices2, 3));
                points2 = new THREE.Points(geometry2, new THREE.PointsMaterial({ color: 0x8A2BE2, size: 1.2, transparent: true, opacity: 0.6 })); // BlueViolet color
                scene.add(points2);
                
                window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }, false);
                document.addEventListener('mousemove', e => { if (camera && camera.position) { camera.position.x += ((e.clientX - window.innerWidth / 2) * 0.1 - camera.position.x) * 0.03; camera.position.y += (-(e.clientY - window.innerHeight / 2) * 0.1 - camera.position.y) * 0.03; camera.lookAt(scene.position); } }, false);
            }
            function animate() { 
                requestAnimationFrame(animate); 
                if (points) { points.rotation.y += 0.0003; } 
                if (points2) { points2.rotation.y -= 0.0004; }
                if (renderer && scene && camera) { renderer.render(scene, camera); } 
            }
            init();
            animate();
        }

            studyChatHistory.push({ role: "user", parts: userParts });
            const payload = { contents: studyChatHistory };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },

            if (!response.ok) {

        async function callImageGenerationAPI(prompt) {
            const API_KEY = "AIzaSyCl0qIk_kfgcaouclxQwFZZ19KpL_AmnT8";
            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${API_KEY}`;
            
            const payload = {
                instances: [{ "prompt": prompt }],
                parameters: { "sampleCount": 1 }
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error.message || 'Imagen API isteği başarısız oldu.');
            }

            const result = await response.json();
            const prediction = result.predictions?.[0];

            if (!prediction || !prediction.bytesBase64Encoded) {
                return { text: "Görsel oluşturulamadı. Lütfen isteminizi değiştirip tekrar deneyin." };
            }

            studyChatHistory.push({ role: "user", parts: [{ text: prompt }] });
            studyChatHistory.push({ role: "model", parts: [{ text: "(Kullanıcının isteği üzerine bir görsel oluşturdum.)" }] });

            return {
                text: "İsteğiniz üzerine görsel oluşturuldu.",
                file: {
                    mimeType: 'image/png',
                    base64: prediction.bytesBase64Encoded
                }
            };
        }

                    updateUserInfoUI(userData);

                    mainNav.innerHTML = Object.entries(MODULES)
                        .filter(([id, m]) => m.roles.includes(userData.role))
                        .map(([id, m]) => `<a href="#" class="nav-link" data-view="${id}">${m.icon}<span>${m.name}</span></a>`).join('');

                    await loadAllFromFirestore(userData.uid);
                    switchView('dashboard', userData);
                    loadingOverlay.style.display = 'none';
                    mainContent.classList.remove('hidden');

                    let currentScheduleKey = null;
                    document.body.addEventListener('click', async e => {
                        const navLink = e.target.closest('.nav-link');
                        if (navLink) { e.preventDefault(); switchView(navLink.dataset.view, userData); return; }

                        const likeBtn = e.target.closest('.like-btn');
                        if (likeBtn) {
                            likeBtn.classList.toggle('liked');
                            const countSpan = likeBtn.querySelector('span');
                            let count = parseInt(countSpan.textContent);
                            countSpan.textContent = likeBtn.classList.contains('liked') ? count + 1 : count - 1;
                            return;
                        }
                        
                        const newsToggle = e.target.closest('#toggle-news-size');
                        if(newsToggle){
                            const feed = document.getElementById('feed-column');
                            const side = document.getElementById('side-column');
                            feed.classList.toggle('lg:w-2/3');
                            feed.classList.toggle('lg:w-1/3');
                            side.classList.toggle('lg:w-1/3');
                            side.classList.toggle('lg:w-2/3');
                            return;
                        }
                        const agendaEdit = e.target.closest('#edit-agenda-btn');
                        if(agendaEdit){
                            const list = document.getElementById('agenda-list');
                            const isEditing = list.classList.toggle('is-editing');
                            agendaEdit.innerHTML = isEditing ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>` : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.5L13.196 5.196z"></path></svg>`;
                            
                            list.querySelectorAll('li').forEach(item => {
                                const timeEl = item.children[0];
                                const titleEl = item.children[1];
                                if(isEditing){
                                    const timeVal = timeEl.textContent;
                                    const titleVal = titleEl.textContent;
                                    timeEl.innerHTML = `<input class="w-full bg-white/5 rounded px-1 text-sm" value="${timeVal}">`;
                                    titleEl.innerHTML = `<input class="w-full bg-white/5 rounded px-1 text-sm" value="${titleVal}">`;
                                } else {
                                    const timeVal = timeEl.querySelector('input').value;
                                    const titleVal = titleEl.querySelector('input').value;
                                    timeEl.innerHTML = timeVal;
                                    titleEl.innerHTML = titleVal;
                                }
                            });
                            return;
                        }

                        // --- MESSENGER EVENT'LERİ ---
                        const messengerHeader = e.target.closest('#messenger-header');
                        if(messengerHeader) {
                            document.getElementById('messenger-widget').classList.toggle('collapsed');
                            return;
                        }
                        const messengerTab = e.target.closest('.messenger-tab-btn');
                        if (messengerTab) {
                            const tabId = messengerTab.dataset.tab;
                            document.querySelectorAll('.messenger-tab-btn').forEach(btn => btn.classList.remove('active'));
                            document.querySelectorAll('.messenger-tab-content').forEach(content => content.classList.remove('active'));
                            messengerTab.classList.add('active');
                            document.getElementById(`${tabId}-content`).classList.add('active');
                            return;
                        }
                        const chatListItem = e.target.closest('.chat-list-item[data-chat-user]');
                        if (chatListItem) {
                            const chatData = JSON.parse(chatListItem.dataset.chatUser);
                            openChatWindow(chatData);
                            return;
                        }
                        const closeChatBtn = e.target.closest('[data-action="close-chat-window"]');
                        if (closeChatBtn) {
                            closeChatBtn.closest('.chat-window').remove();
                            return;
                        }

                        // --- TAB LOGIC (GPA/PLANNER & LIBRARY) ---
                        const tabBtn = e.target.closest('[data-tab-btn], [data-library-tab-btn]');
                        if(tabBtn){
                            const isLibrary = tabBtn.hasAttribute('data-library-tab-btn');
                            const tabId = isLibrary ? tabBtn.dataset.libraryTabBtn : tabBtn.dataset.tabBtn;
                            const parentSelector = isLibrary ? '#storage-view' : '#gpa-tracker-view';
                            const contentSelector = isLibrary ? '.library-tab-content' : '.tab-content-panel';
                            const sectionId = isLibrary ? `${tabId}-library-section` : `${tabId}-section`;

                            const parent = tabBtn.closest(parentSelector);
                            if (!parent) return;

                            parent.querySelectorAll(isLibrary ? '[data-library-tab-btn]' : '[data-tab-btn]').forEach(b => b.classList.remove('active'));
                            tabBtn.classList.add('active');

                            parent.querySelectorAll(contentSelector).forEach(p => p.classList.remove('active'));
                            parent.querySelector(`#${sectionId}`)?.classList.add('active');
                            return;
                        }
                        
                        const actionEl = e.target.closest('[data-action]');
                        if(!actionEl) return;
                        const action = actionEl.dataset.action;

                        if(action === 'open-schedule-modal'){
                            currentScheduleKey = actionEl.dataset.key;
                            document.getElementById('schedule-modal').classList.remove('hidden');
                            document.getElementById('schedule-modal-search').focus();
                            return;
                        }
                        if(action === 'close-schedule-modal' || e.target.id === 'schedule-modal'){
                             document.getElementById('schedule-modal').classList.add('hidden');
                             currentScheduleKey = null;
                             return;
                        }

                        const courseButton = e.target.closest('[data-course-name]');
                        if (courseButton && currentScheduleKey) {
                            const courseName = courseButton.dataset.courseName;
                            asyaState.planner.schedule[currentScheduleKey] = courseName;
                            saveAllDebounced(userData.uid);
                            // Re-render planner section dynamically without reloading the whole view
                            const renderContext = { userData, asyaState, helpers: { computeGPA, yearGPA, getCalendarGrid, fmtDate, genId } };
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            document.getElementById('schedule-modal').classList.add('hidden');
                            currentScheduleKey = null;
                            return;
                        }

                        if(action==='save-gpa'){ await forceSaveAll(userData.uid); return; }

                        const renderContext = { userData, asyaState, helpers: { computeGPA, yearGPA, getCalendarGrid, fmtDate, genId } };
                        if(action==='add-year'){
                            asyaState.gpa.years.push({ id: genId(), title: (asyaState.gpa.years.length+1)+". Yıl", kuruls: [] });
                            saveAllDebounced(userData.uid);
                            document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            return;
                        }
                        if(action==='remove-year'){
                            const yid = actionEl.dataset.year;
                            asyaState.gpa.years = asyaState.gpa.years.filter(y=>y.id!==yid);
                            saveAllDebounced(userData.uid);
                            document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            return;
                        }
                        if(action==='add-kurul'){
                            const yid = actionEl.dataset.year;
                            const y = asyaState.gpa.years.find(y=>y.id===yid);
                            if(y){
                                y.kuruls = y.kuruls||[];
                                y.kuruls.push({ id: genId(), title: (y.kuruls.length+1)+". Kurul", examGrade: "", courses: [] });
                                saveAllDebounced(userData.uid);
                                document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            }
                            return;
                        }
                        if(action==='remove-kurul'){
                            const yid = actionEl.dataset.year, kid = actionEl.dataset.kurul;
                            const y = asyaState.gpa.years.find(y=>y.id===yid);
                            if(y){ y.kuruls = (y.kuruls||[]).filter(k=>k.id!==kid); }
                            saveAllDebounced(userData.uid);
                             document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            return;
                        }
                        if(action==='add-course'){
                            const yid = actionEl.dataset.year, kid = actionEl.dataset.kurul;
                            const y = asyaState.gpa.years.find(y=>y.id===yid);
                            const k = y?.kuruls?.find(k=>k.id===kid);
                            if(k){
                                k.courses = k.courses||[];
                                k.courses.push({ id: genId(), name:"", credit:0, grade:"" });
                                saveAllDebounced(userData.uid);
                                document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            }
                            return;
                        }
                        if(action==='remove-course'){
                            const yid = actionEl.dataset.year, kid=actionEl.dataset.kurul, cid=actionEl.dataset.course;
                            const y = asyaState.gpa.years.find(y=>y.id===yid);
                            const k = y?.kuruls?.find(k=>k.id===kid);
                            if(k){ k.courses = (k.courses||[]).filter(c=>c.id!==cid); }
                            saveAllDebounced(userData.uid);
                            document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                            return;
                        }

                        if(action==='calendar-prev' || action==='calendar-next'){
                            const mm = asyaState.planner.monthYear.month + (action==='calendar-prev'?-1:1);
                            const date = new Date(asyaState.planner.monthYear.year, mm, 1);
                            asyaState.planner.monthYear = { year: date.getFullYear(), month: date.getMonth() };
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='select-date'){
                            asyaState.planner.selectedDate = actionEl.dataset.date;
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='add-date-task'){
                            const input = document.querySelector('[data-action="date-task-input"]');
                            const val = (input?.value||"").trim();
                            if(!val) return;
                            const key = asyaState.planner.selectedDate;
                            asyaState.planner.byDate[key] = asyaState.planner.byDate[key]||[];
                            asyaState.planner.byDate[key].push({ id: genId(), text: val, done:false });
                            input.value = "";
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='toggle-date-task' || action==='delete-date-task'){
                            const key = asyaState.planner.selectedDate;
                            const list = asyaState.planner.byDate[key]||[];
                            const id = actionEl.dataset.id;
                            const idx = list.findIndex(t=>t.id===id);
                            if(idx>-1){
                                if(action==='toggle-date-task') list[idx].done = !list[idx].done;
                                else list.splice(idx,1);
                                saveAllDebounced(userData.uid);
                                document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            }
                            return;
                        }

                        if(action==='add-weekly-task'){
                            const input = document.querySelector('[data-action="weekly-task-input"]');
                            const val = (input?.value||"").trim(); if(!val) return;
                            asyaState.planner.weekly.push({ text: val, done:false });
                            input.value="";
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='toggle-weekly-task' || action==='delete-weekly-task'){
                            const idx = Number(actionEl.dataset.index);
                            if(action==='toggle-weekly-task') asyaState.planner.weekly[idx].done = !asyaState.planner.weekly[idx].done;
                            else asyaState.planner.weekly.splice(idx,1);
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='add-daily-task'){
                            const input = document.querySelector('[data-action="daily-task-input"]');
                            const val = (input?.value||"").trim(); if(!val) return;
                            asyaState.planner.daily.push({ text: val, done:false });
                            input.value="";
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                        if(action==='toggle-daily-task' || action==='delete-daily-task'){
                            const idx = Number(actionEl.dataset.index);
                            if(action==='toggle-daily-task') asyaState.planner.daily[idx].done = !asyaState.planner.daily[idx].done;
                            else asyaState.planner.daily.splice(idx,1);
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                         if(action==='clear-daily-tasks'){
                            asyaState.planner.daily = [];
                            saveAllDebounced(userData.uid);
                            document.getElementById('planner-section').innerHTML = gpaPlannerModule.renderPlannerSection(renderContext);
                            return;
                        }
                    });

                    document.body.addEventListener('input', e=>{
                        const el = e.target;
                        if(el.id === 'schedule-modal-search') {
                            const filter = el.value.toLowerCase();
                            const listContainer = document.getElementById('schedule-modal-list');
                            const items = listContainer.getElementsByTagName('button');
                            for (let i = 0; i < items.length; i++) {
                                const txtValue = items[i].textContent || items[i].innerText;
                                if (txtValue.toLowerCase().indexOf(filter) > -1) {
                                    items[i].style.display = "";
                                } else {
                                    items[i].style.display = "none";
                                }
                            }
                            return;
                        }

                        const actionEl = e.target.closest('[data-action]');
                        if(!actionEl) return;
                        const a = actionEl.dataset.action;

                        let needsGpaUpdate = false;
                        const renderContext = { userData, asyaState, helpers: { computeGPA, yearGPA, getCalendarGrid, fmtDate, genId } };

                        if(a==='change-target-grade'){
                             asyaState.targetFutureGrade = actionEl.value;
                             needsGpaUpdate = true;
                        }
                        if(a==='edit-year-title'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            if(y){ y.title = actionEl.value; saveAllDebounced(userData.uid); }
                        }
                        if(a==='edit-kurul-title'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            const k = y?.kuruls?.find(K=>K.id===actionEl.dataset.kurul);
                            if(k){ k.title = actionEl.value; saveAllDebounced(userData.uid); }
                        }
                        if(a==='edit-kurul-exam-grade'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            const k = y?.kuruls?.find(K=>K.id===actionEl.dataset.kurul);
                            if(k){ k.examGrade = actionEl.value; saveAllDebounced(userData.uid); }
                        }
                        if(a==='edit-course-name'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            const k = y?.kuruls?.find(K=>K.id===actionEl.dataset.kurul);
                            const c = k?.courses?.find(C=>C.id===actionEl.dataset.course);
                            if(c){ c.name = actionEl.value; saveAllDebounced(userData.uid); }
                        }
                        if(a==='edit-course-credit'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            const k = y?.kuruls?.find(K=>K.id===actionEl.dataset.kurul);
                            const c = k?.courses?.find(C=>C.id===actionEl.dataset.course);
                            if(c){ c.credit = Number(actionEl.value)||0; needsGpaUpdate = true; }
                        }
                        if(a==='edit-course-grade'){
                            const y = asyaState.gpa.years.find(Y=>Y.id===actionEl.dataset.year);
                            const k = y?.kuruls?.find(K=>K.id===actionEl.dataset.kurul);
                            const c = k?.courses?.find(C=>C.id===actionEl.dataset.course);
                            if(c){ c.grade = actionEl.value; needsGpaUpdate = true; }
                        }
                        
                        if(needsGpaUpdate){
                             saveAllDebounced(userData.uid);
                             document.getElementById('gpa-section').innerHTML = gpaPlannerModule.renderGpaSection(renderContext);
                        }
                    });

                } else {
                    console.error("Kullanıcı doğrulanmış ama Firestore verisi bulunamadı. Yönlendiriliyor.");
                    await signOut(auth);
                    window.location.href = 'login.html';
                }
            } else {
                console.log("Kullanıcı giriş yapmamış, yönlendiriliyor.");
                window.location.href = 'login.html';
            }
        };

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
        initializePage();
        initBackgroundAnimation();

    </script>
</body>
</html>
