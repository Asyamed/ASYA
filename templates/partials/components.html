{% macro feature_highlight_card(icon_svg, title, description) %}
<div class="w-full feature-card card-hover rounded-2xl p-5 flex items-start gap-4">
    <div>
        <div class="flex items-center justify-center h-10 w-10 rounded-lg bg-gray-800 border border-gray-700">
            {{ icon_svg | safe }}
        </div>
    </div>
    <div>
        <h4 class="font-bold text-white">{{ title }}</h4>
        <p class="text-sm text-gray-400 mt-1">{{ description }}</p>
    </div>
</div>
{% endmacro %}

{% macro problem_card(icon_svg, title, description) %}
<div class="text-center p-6">
    <div class="flex items-center justify-center h-16 w-16 rounded-full bg-gray-800 border border-gray-700 mb-4 mx-auto">
        {{ icon_svg | safe }}
    </div>
    <h3 class="text-xl font-bold">{{ title }}</h3>
    <p class="text-gray-400 mt-2">{{ description }}</p>
</div>
{% endmacro %}
