<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token|default('') }}">
    <title>{% block title %}ASYA{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/index.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body class="antialiased font-[Inter]" data-api-base="{{ api_base_url|default('') }}" data-auth-state="{{ auth_state|default('anonymous') }}" data-auth-sync-endpoint="{{ auth_sync_endpoint|default('') }}" data-csrf-token="{{ csrf_token|default('') }}">
    <!-- backend-placeholder:body-dataset
         api_base_url -> Backend API temel adresi
         auth_state -> 'authenticated', 'anonymous' gibi mevcut oturum durumu
         auth_sync_endpoint -> Frontend oturum olaylarını backend'e iletecek uç nokta
         csrf_token -> Sunucu tarafından üretilecek token -->
    <div id="scene-container"></div>
    {% block header %}
        {% include 'partials/site_header.html' %}
    {% endblock %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block footer %}
        {% include 'partials/site_footer.html' %}
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
